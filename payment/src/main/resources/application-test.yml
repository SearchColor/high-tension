# 테스트 환경에서만 사용되는 설정
spring:
  # 인메모리 H2 DB 설정으로 MySQL 설정을 덮어쓴다.
  datasource:
    # H2를 사용하도록 URL 변경
    url: jdbc:h2:mem:payment_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: create # 테스트 시에는 매번 테이블을 재생성하여 깨끗한 상태를 유지

  # 테스트 시에는 Kafka 리스너가 필요하지 않으므로 비활성화 (선택 사항)
  kafka:
    listener:
      auto-startup: false