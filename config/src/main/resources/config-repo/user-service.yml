server:
  port: 8100

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/user_service?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: admin1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: user_service
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # Security JWT Secret (256-bit)
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-key-in-production-must-be-at-least-256-bits-long}
      access-token-validity: 86400000  # 24시간 (개발 환경용, 프로덕션: 3600000 = 1시간)
      refresh-token-validity: 2592000000  # 30일 (개발 환경용, 프로덕션: 604800000 = 7일)

management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.high.user: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: TRACE
  logback:
    rollingpolicy:
      max-file-size: 10MB           # 파일 최대 크기
      max-history: 7                # 7일간 보관
      total-size-cap: 1GB           # 전체 로그 최대 1GB
      clean-history-on-start: true  # 시작 시 오래된 로그 정리
