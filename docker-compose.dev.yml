version: '3.8' # Docker Compose 파일 형식 버전 지정

services:
  # 1. MySQL (관계형 데이터베이스)
  mysql:
    image: mysql:8.0
    container_name: msa-mysql
    restart: always
    environment:
      # Config Server의 user-service.yml과 동일한 비밀번호 사용
      MYSQL_ROOT_PASSWORD: admin1234
    ports:
      # 호스트:컨테이너 포트 매핑
      - "3306:3306"
    volumes:
      # 데이터 영속성을 위한 볼륨 설정
      - mysql-data:/var/lib/mysql
      - ./create_schema.sql:/docker-entrypoint-initdb.d/create_schemas.sql
    networks:
      - msa-network

  # 2. Redis (인메모리 캐시/데이터 저장소)
  redis:
    image: redis:6.2-alpine
    container_name: msa-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      # 데이터 영속성을 위한 볼륨 설정
      - redis-data:/data
    networks:
      - msa-network

  # 3. Kafka (메시지 브로커) 및 Zookeeper
  # Kafka는 메타데이터 관리를 위해 Zookeeper에 의존합니다.

  # 3-1. Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: msa-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - msa-network

  # 3-2. Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: msa-kafka
    restart: always
    depends_on:
      - zookeeper # Zookeeper가 먼저 시작되어야 함
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # 내부 네트워크 이름 사용
      # 외부 접속을 위한 설정 (Host PC에서 접근 시 사용)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - msa-network

  # 4. MongoDB (NoSQL 데이터베이스)
  mongodb:
    image: mongo:6.0
    container_name: msa-mongodb
    restart: always
    environment:
      # 사용자 인증을 위한 초기 설정 (선택 사항)
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - msa-network

  # 5. Config Server (중앙 설정 서버)
  config-server:
    image: gradle:8.5-jdk17
    container_name: msa-config
    working_dir: /app
    volumes:
      - ./config:/app
      - gradle-cache:/root/.gradle
    command: gradle bootRun --no-daemon
    ports:
      - "8888:8888"
    networks:
      - msa-network
    environment:
      # Config Server가 user-service.yml의 ${JWT_SECRET} placeholder를 치환하기 위해 필요
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 6. Eureka Server (서비스 디스커버리)
  eureka-server:
    image: gradle:8.5-jdk17
    container_name: msa-eureka
    working_dir: /app
    volumes:
      - ./server:/app
      - gradle-cache:/root/.gradle
    command: gradle bootRun --no-daemon
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - msa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 7. Gateway Service (API Gateway)
  gateway-service:
    image: gradle:8.5-jdk17
    container_name: msa-gateway
    working_dir: /app
    volumes:
      - ./gateway:/app
      - gradle-cache:/root/.gradle
    command: gradle bootRun --no-daemon
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - msa-network
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}

  # 8. User Service (사용자 관리)
  user-service:
    image: gradle:8.5-jdk17
    container_name: msa-user
    working_dir: /app
    volumes:
      - ./user:/app
      - gradle-cache:/root/.gradle
    command: gradle bootRun --no-daemon
    ports:
      - "8100:8100"
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - msa-network
    environment:
      # Docker 프로파일 활성화
      SPRING_PROFILES_ACTIVE: docker
      # Config Server 직접 연결 (부트스트랩 단계에서 적용)
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      # MySQL Docker 컨테이너 호스트 오버라이드
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_service?serverTimezone=UTC&characterEncoding=UTF-8
      # Redis Docker 환경 오버라이드
      SPRING_DATA_REDIS_HOST: redis
      REDIS_HOST: redis
      # Eureka Docker 환경 오버라이드
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
      # JWT Secret
      JWT_SECRET: ${JWT_SECRET}

  # 9. Coupon Service (쿠폰 관리)
  coupon-service:
    image: gradle:8.5-jdk17
    container_name: msa-coupon
    working_dir: /app
    volumes:
      - ./coupon:/app
      - gradle-cache:/root/.gradle
    command: gradle bootRun --no-daemon
    ports:
      - "8600:8600"
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - msa-network
    environment:
      # Docker 프로파일 활성화
      SPRING_PROFILES_ACTIVE: docker
      # Config Server 직접 연결
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      # MySQL Docker 컨테이너 호스트 오버라이드
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon_service?serverTimezone=UTC&characterEncoding=UTF-8
      # Redis Docker 환경 오버라이드
      SPRING_DATA_REDIS_HOST: redis
      REDIS_HOST: redis
      # Eureka Docker 환경 오버라이드
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: coupon-service

# 볼륨 정의 (데이터 영속성 확보)
volumes:
  mysql-data:
  redis-data:
  mongo-data:
  gradle-cache:

# 네트워크 정의 (컨테이너 간 통신)
networks:
  msa-network:
    driver: bridge

