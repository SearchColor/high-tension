server:
  port: 8000
  netty:
    idle-timeout: 30s  # 30초 동안 유휴 상태면 연결 종료
    connection-timeout: 5s

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: gateway-service
    hostname: localhost
spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-service

  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # JWT configuration
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-key-in-production-must-be-at-least-256-bits-long}

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000  # 5초 (밀리초)
        response-timeout: 30s  # 30초
        pool:
          max-connections: 500
          max-idle-time: 30s
      discovery:
        locator:
          enabled: true
      routes:
            # 1. User Service (8100) - Authentication base
            - id: user-admin-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/master/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/user-service
                    statusCodes:
                      - 408
                      - 500
                      - 502
                      - 503
                      - 504

            - id: user-internal-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/internal/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/user-service
                    statusCodes:
                      - 408
                      - 500
                      - 502
                      - 503
                      - 504

            # Passkey Service (명시적 라우팅 - 향후 분리 시 변경 용이)
            - id: passkey-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/passkeys/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/user-service
                    statusCodes:
                      - 408
                      - 500
                      - 502
                      - 503
                      - 504

            - id: user-test-page
              uri: lb://user-service
              predicates:
                - Path=/passkey-test.html

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/user-service
                    statusCodes:
                      - 408
                      - 500
                      - 502
                      - 503
                      - 504

            - id: user-docs
              uri: lb://user-service
              predicates:
                - Path=/users/v3/api-docs
              filters:
                - StripPrefix=1

            # 2. Product Service (8200)
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            - id: product-docs
              uri: lb://product-service
              predicates:
                - Path=/products/v3/api-docs
              filters:
                - StripPrefix=1

            # 3. Cart Service (8700)
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/carts/**

            - id: cart-docs
              uri: lb://cart-service
              predicates:
                - Path=/carts/v3/api-docs
              filters:
                - StripPrefix=1

            # 4. Coupon Service (8600)
            - id: coupon-internal-service
              uri: lb://coupon-service
              predicates:
                - Path=/api/v1/internal/coupons/**

            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                - Path=/api/v1/coupons/**

            - id: coupon-docs
              uri: lb://coupon-service
              predicates:
                - Path=/coupons/v3/api-docs
              filters:
                - StripPrefix=1

            # 5. Order Service (8400)
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              # metadata:
              #   response-timeout: 60000  # 주문은 60초
              #   connect-timeout: 10000

            - id: order-docs
              uri: lb://order-service
              predicates:
                - Path=/orders/v3/api-docs
              filters:
                - StripPrefix=1

            # 6. Payment Service (8300)
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
              # metadata:
              #   response-timeout: 45000  # 결제는 45초
              #   connect-timeout: 10000

            - id: payment-docs
              uri: lb://payment-service
              predicates:
                - Path=/payments/v3/api-docs
              filters:
                - StripPrefix=1

            # 7. Orchestration Service (8900)
            - id: orchestration-service
              uri: lb://orchestration-service
              predicates:
                - Path=/api/v1/orchestrations/**

            - id: orchestration-docs
              uri: lb://orchestration-service
              predicates:
                - Path=/orchestrations/v3/api-docs
              filters:
                - StripPrefix=1

            # 8. External Service (8500)
            - id: external-service
              uri: lb://external-service
              predicates:
                - Path=/api/v1/externals/**

            - id: external-docs
              uri: lb://external-service
              predicates:
                - Path=/externals/v3/api-docs
              filters:
                - StripPrefix=1

springdoc:
  swagger-ui:
    path: /docs
    urls:
      - name: user-service
        url: /users/v3/api-docs
      - name: product-service
        url: /products/v3/api-docs
      - name: cart-service
        url: /carts/v3/api-docs
      - name: coupon-service
        url: /coupons/v3/api-docs
      - name: order-service
        url: /orders/v3/api-docs
      - name: payment-service
        url: /payments/v3/api-docs
      - name: orchestration-service
        url: /orchestrations/v3/api-docs
      - name: external-service
        url: /externals/v3/api-docs

management:
  endpoints:
    web:
      base-path: /internal/actuator
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
    org.springframework.web: DEBUG
    com.high.gateway.filter: DEBUG
    com.high.gateway.service: DEBUG

# Rate Limiting configuration (Token Bucket Algorithm)
rate-limit:
  max-tokens: 100        # 버킷 최대 용량 (tokens)
  refill-rate: 10        # 초당 토큰 리필 속도 (tokens/sec)

# Circuit Breaker configuration (Resilience4j)
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      userServiceCircuitBreaker:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    instances:
      userServiceCircuitBreaker:
        timeoutDuration: 5s
