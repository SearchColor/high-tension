server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: gateway-service
    hostname: localhost
spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-service

  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # JWT configuration
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-key-in-production-must-be-at-least-256-bits-long}

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      server:
        webflux:
          routes:
            # 1. User Service (8100) - Authentication base
            - id: user-admin-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/master/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: user-docs
              uri: lb://user-service
              predicates:
                - Path=/users/v3/api-docs

            # 2. Product Service (8200)
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            - id: product-docs
              uri: lb://product-service
              predicates:
                - Path=/products/v3/api-docs

            # 3. Cart Service (8700)
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/carts/**

            - id: cart-docs
              uri: lb://cart-service
              predicates:
                - Path=/carts/v3/api-docs

            # 4. Coupon Service (8600)
            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                - Path=/api/v1/coupons/**

            - id: coupon-docs
              uri: lb://coupon-service
              predicates:
                - Path=/coupons/v3/api-docs

            # 5. Order Service (8400)
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

            - id: order-docs
              uri: lb://order-service
              predicates:
                - Path=/orders/v3/api-docs

            # 6. Payment Service (8300)
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

            - id: payment-docs
              uri: lb://payment-service
              predicates:
                - Path=/payments/v3/api-docs

            # 7. Orchestration Service (8900)
            - id: orchestration-service
              uri: lb://orchestration-service
              predicates:
                - Path=/api/v1/orchestrations/**

            - id: orchestration-docs
              uri: lb://orchestration-service
              predicates:
                - Path=/orchestrations/v3/api-docs

            # 8. External Service (8500)
            - id: external-service
              uri: lb://external-service
              predicates:
                - Path=/api/v1/externals/**

            - id: external-docs
              uri: lb://external-service
              predicates:
                - Path=/externals/v3/api-docs

springdoc:
  swagger-ui:
    path: /docs
    urls:
      - name: user-service
        url: /users/v3/api-docs
      - name: product-service
        url: /products/v3/api-docs
      - name: cart-service
        url: /carts/v3/api-docs
      - name: coupon-service
        url: /coupons/v3/api-docs
      - name: order-service
        url: /orders/v3/api-docs
      - name: payment-service
        url: /payments/v3/api-docs
      - name: orchestration-service
        url: /orchestrations/v3/api-docs
      - name: external-service
        url: /externals/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    com.high.gateway.filter: DEBUG
    com.high.gateway.service: DEBUG

# Rate Limiting configuration (Token Bucket Algorithm)
rate-limit:
  max-tokens: 100        # 버킷 최대 용량 (tokens)
  refill-rate: 10        # 초당 토큰 리필 속도 (tokens/sec)
