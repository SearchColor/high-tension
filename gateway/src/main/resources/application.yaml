server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: gateway-service
    hostname: localhost
spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

            - id: order-docs
              uri: lb://order-service
              predicates:
                - Path=/orders/v3/api-docs

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: user-docs
              uri: lb://user-service
              predicates:
                - Path=/users/v3/api-docs

            - id: coupon-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: coupon-docs
              uri: lb://coupon-service
              predicates:
                - Path=/coupons/v3/api-docs

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            - id: product-docs
              uri: lb://product-service
              predicates:
                - Path=/products/v3/api-docs

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

            - id: payment-docs
              uri: lb://payment-service
              predicates:
                - Path=/payments/v3/api-docs

            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/carts/**

            - id: cart-docs
              uri: lb://cart-service
              predicates:
                - Path=/carts/v3/api-docs

            - id: external-service
              uri: lb://external-service
              predicates:
                - Path=/api/v1/externals/**

            - id: external-docs
              uri: lb://external-service
              predicates:
                - Path=/externals/v3/api-docs

springdoc:
  swagger-ui:
    path: /docs
    urls:
      - name: order-service
        url: /orders/v3/api-docs
      - name: product-service
        url: /products/v3/api-docs
      - name: user-service
        url: /users/v3/api-docs
      - name: delivery-service
        url: /deliveries/v3/api-docs
      - name: company-service
        url: /companies/v3/api-docs
      - name: hub-service
        url: /hubs/v3/api-docs
      - name: external-service
        url: /externals/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG