input {
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp-input"]
  }

  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["msa_app_logs"]
    group_id => "logstash-consumer-group"
    codec => json
    tags => ["kafka-input"]
  }
}

filter {
    if "kafka-input" in [tags] {

       # service_name 필드에서 경로 제거하고 파일명만 추출
       if [service_name] {
           mutate {
               # "/"로 시작해서 마지막 "/"까지 포함된 모든 문자열을 빈 값("")으로 교체
               gsub => [ "service_name", "^.*/", "" ]
               # 확장자 및 접미사 제거 (순수 서비스명만 남김)
               gsub => [ "service_name", "-json\.log$", "" ]
           }
       }
        mutate {
            remove_field => ["service.name", "serviceName"]
        }


        if [duration_ms] {
            mutate {
                convert => { "duration_ms" => "integer" }
            }
        }

        # @timestamp 처리 (파싱 에러 방지)
        # 이미 JSON 내부의 @timestamp가 올바른 형식이면 date 필터가 실패할 수 있습니다.
        # 실패하더라도 로그 수집은 되도록 처리합니다.
        date {
            match => [ "@timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
            target => "@timestamp"
            timezone => "Asia/Seoul"
            tag_on_failure => ["_date_parse_fallback"]
        }

        # 로그 유형(log.type) 분류
        if [logger_name] =~ /org\.hibernate\.SQL/ {
             mutate { replace => { "log.type" => "sql" } }
        } else if ![log.type] {
             mutate { add_field => { "log.type" => "application" } }
        }

        # 레벨 정규화
        if [level] {
            mutate {
                strip => ["level"]
                uppercase => ["level"]
            }
        }
    }
}

output {
    if [level] == "ERROR" {
        elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            index => "msa-errors-%{+YYYY.MM.dd}"
        }
    } else {
        elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            index => "msa-app-logs-%{+YYYY.MM.dd}"
        }
    }
}