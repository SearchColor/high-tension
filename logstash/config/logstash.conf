input {
  # TCP 입력 추가 (로컬 애플리케이션용)
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp-input"]
  }

  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["msa_app_logs"]
    group_id => "logstash-consumer-group"
    codec => json
    tags => ["kafka-input"]
  }
}

filter {
    # app_source 필드를 문자열로 변환
    mutate {
        convert => { "app_source" => "string" }
    }

    if [app_source] == "msa-local" {

        # Spring Boot 로그 파싱 (실제 형식에 맞춤)
        grok {
            match => {
                "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:level}\s+%{NUMBER:pid}\s+---\s+\[%{DATA:service}\]\s+\[%{DATA:thread}\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:message_content}"
            }
            tag_on_failure => ["_grokparsefailure_msa_app"]
        }

        # Grok 파싱이 성공한 경우에만 후처리
        if "_grokparsefailure_msa_app" not in [tags] {

            # ISO8601 타임스탬프를 @timestamp로 변환
            date {
                match => [ "log_timestamp", "ISO8601" ]
                target => "@timestamp"
                timezone => "Asia/Seoul"
                remove_field => ["log_timestamp"]
            }
            # 필드 정리 및 재구성
            mutate {
                # 🔍 디버깅: message_content를 별도로 보관
                add_field => { "parsed_message" => "%{message_content}" }
                # message_content를 message로 교체
                replace => { "message" => "%{message_content}" }
                remove_field => ["message_content"]
            }

            # SQL 쿼리 감지 (Hibernate SQL 로그 식별)
            if [logger] =~ /org\.hibernate\.SQL/ {
                mutate {
                    add_field => { "log_type" => "sql" }
                }
            } else {
                mutate {
                    add_field => { "log_type" => "application" }
                }
            }

        } else {
            # Grok 파싱 실패 시: 원본 message 유지하고 태그만 추가
            mutate {
                add_field => {
                    "parse_status" => "grok_failed"
                    "log_type" => "unparsed"
                }
            }
        }
    }
}

output {
  if [level] == "ERROR" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "msa-errors-%{+YYYY.MM.dd}"
    }
  }
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "msa-app-logs-%{+YYYY.MM.dd}"
  }
}